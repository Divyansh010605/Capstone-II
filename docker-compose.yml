version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: stock_market_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: stock_market_ai
    volumes:
      - mongodb_data:/data/db
    networks:
      - stock_market_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stock_market_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AI-Based Stock Market Trend Prediction & Risk Analysis
      - API_V1_STR=/api/v1
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/stock_market_ai
      - MONGODB_DB_NAME=stock_market_ai
      - SECRET_KEY=prod-stock-ai-risk-super-secure-jwt-secret-key-32chars-min!
      - AI_ENGINE_URL=http://ai_engine:8001
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - stock_market_net

  # 3. AI / ML Inference Engine Microservice
  ai_engine:
    build:
      context: .
      dockerfile: ai_engine/Dockerfile
    container_name: stock_market_ai_engine
    restart: always
    ports:
      - "8001:8001"
    environment:
      - LOOKBACK_WINDOW=60
    networks:
      - stock_market_net

  # 4. React Production Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock_market_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - stock_market_net

networks:
  stock_market_net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
